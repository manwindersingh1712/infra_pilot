name: CI

on:
  push:
    branches: [master, go-migration]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane-go/go.mod
          cache-dependency-path: control-plane-go/go.sum
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: control-plane-go
          version: latest
      - run: go test -race ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: Forbid shell invocation (G204 is excluded)
        run: |
          if grep -rnE --include='*.go' --exclude='*_test.go' \
            '(exec\.Command(Context)?\(([A-Za-z_][A-Za-z0-9_.]*, *)?|\.Run\([^,]+, *[^,]+, *)"(ba)?sh"' .; then
            echo "::error::Run programs directly with an argument list, never through sh/bash."; exit 1
          fi
      # G204 excluded: the runtime runs git/docker with argument lists by design. The step above
      # forbids shell invocation. Every other finding is fixed or annotated
      # "// #nosec Gxxx -- <reason>" at the site.
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec -quiet -exclude=G204 ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cp-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cp-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
