name: CI

on:
  push:
    branches: [master, go-migration]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane-go
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: control-plane-go/go.sum
      - run: go build ./...
      - name: Forbid test helpers in production binaries
        run: |
          deps=$(go list -deps ./cmd/...) || exit 1
          if printf '%s\n' "$deps" | grep -E 'testcontainers|github.com/moby/|infrapilot/internal/testutil'; then
            echo "::error::production binaries must not import test helpers"; exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: control-plane-go
          version: v2.14.0
      # Static determinism check of workflow code (pinned; v0.6.0 is the latest
      # release and works with SDK v1.49.0). The unit tests only trace activities.
      - name: Workflow determinism (workflowcheck)
        run: go run go.temporal.io/sdk/contrib/tools/workflowcheck@v0.6.0 ./internal/workflows/...
      - run: go test -race ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 && govulncheck ./...
      - name: Forbid shell invocation (G204 is excluded)
        run: |
          if grep -rnE --include='*.go' --exclude='*_test.go' \
            '(exec\.Command(Context)?\(([A-Za-z_][A-Za-z0-9_.]*, *)?|\.Run\([^,]+, *[^,]+, *)"(ba)?sh"' .; then
            echo "::error::Run programs directly with an argument list, never through sh/bash."; exit 1
          fi
      # G204 excluded: the runtime runs git/docker with argument lists by design. The step above
      # forbids shell invocation. Every other finding is fixed or annotated
      # "// #nosec Gxxx -- <reason>" at the site.
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0 && gosec -quiet -exclude=G204 ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cp-ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # check:logic runs a .ts file and needs type stripping (Node 22.18+)
          cache: npm
          cache-dependency-path: cp-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:logic
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
