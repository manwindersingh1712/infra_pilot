server {
    listen 80;
    server_name _;

    # Docker embedded DNS so container names resolve dynamically
    resolver 127.0.0.11 valid=10s;

    # Per-service reverse-proxy routes (auto-generated)
    include /etc/nginx/conf.d/routes/*.conf;

    # Fallback: if the request has a Referer from a service page,
    # rewrite the URL to go through that service's proxy location.
    # This handles JS-initiated asset loads (e.g. img.src = "/logo.png")
    # that the browser requests as absolute paths without the prefix.
    location / {
        if ($referer_svc) {
            rewrite ^(.*)$ /s/$referer_svc$1 last;
        }
        return 404 '{"error":"not_found"}\n';
        default_type application/json;
    }
}
