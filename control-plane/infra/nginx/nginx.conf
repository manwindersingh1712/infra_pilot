events {}

http {
  # Extract service ID from the Referer header so unmatched asset requests
  # (e.g. /tech_logos/next.png) can be routed to the correct container.
  map $http_referer $referer_svc {
    ~*/s/([a-zA-Z0-9]+)/ $1;
    default "";
  }

  include /etc/nginx/conf.d/*.conf;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;
}
